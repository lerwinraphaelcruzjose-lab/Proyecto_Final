{% extends "base.html" %}

{% block title %}Página No Encontrada (404){% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-hotel shadow-sm p-5">
            <div class="display-1 fw-bold text-primary mb-3">
                <i class="bi bi-compass"></i> 404
            </div>
            <h3 class="fw-bold mb-2">¡Página no encontrada!</h3>
            <p class="text-muted mb-4">
                El recurso o página que estás buscando no existe o ha sido movido.
            </p>
            <div>
                <a href="{{ url_for('inicio') }}" class="btn btn-hotel-primary px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
