{% extends "base.html" %}

{% block title %}Error del Servidor (500){% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card card-hotel shadow-sm p-5">
            <div class="display-1 fw-bold text-danger mb-3">
                <i class="bi bi-exclamation-octagon"></i> 500
            </div>
            <h3 class="fw-bold mb-2">Error Interno del Servidor</h3>
            <p class="text-muted mb-4">
                Ocurrió un problema inesperado en el servidor. Por favor, intenta nuevamente más tarde o contacta al administrador.
            </p>
            <div>
                <a href="{{ url_for('inicio') }}" class="btn btn-hotel-primary px-4 py-2">
                    <i class="bi bi-house-door-fill me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
